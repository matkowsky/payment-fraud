<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750"><rect width="1000" height="750" fill="white" /><text x="25" y="35" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#213447" font-weight="bold">What each kind of record can establish</text><text x="25" y="67" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">The classes preserve meaning; records need not pass through them in sequence</text><rect x="25" y="95" width="460" height="137" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="126" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">SO: Source observations</text><text x="45" y="159" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">26 signals; includes reported labels</text><text x="45" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Evidence that the recorded event</text><text x="45" y="209" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">or report occurred</text><rect x="510" y="95" width="460" height="137" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="530" y="126" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">NO: Normalized observations</text><text x="530" y="159" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">2 cross-cutting provenance signals</text><text x="530" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Keep source, scope and time</text><text x="530" y="209" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">when normalizing</text><rect x="25" y="250" width="460" height="112" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="281" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">DF: Derived features</text><text x="45" y="314" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">24 signals; versioned inputs</text><text x="45" y="339" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Window, as-of time and recomputable inputs</text><rect x="510" y="250" width="460" height="112" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="530" y="281" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">MO: Model / risk outputs</text><text x="530" y="314" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">2 signals; assessment and version</text><text x="530" y="339" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">A score is an assessment, not proof of conduct</text><rect x="25" y="380" width="460" height="137" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="411" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">CO: Control outcomes</text><text x="45" y="444" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#213447" font-weight="normal">10 signals; decision and authority</text><text x="45" y="468" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#213447" font-weight="normal">Correctness may be unknown;</text><text x="45" y="492" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#213447" font-weight="normal">keep error rates separate</text><rect x="510" y="380" width="460" height="137" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="530" y="411" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">XK: External knowledge</text><text x="530" y="444" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">7 signals; external provenance</text><text x="530" y="469" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Observation, assessment or framework</text><rect x="25" y="535" width="460" height="112" rx="10" fill="#eaf0e7" stroke="#657e91" /><text x="45" y="566" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Analytical inference</text><text x="45" y="599" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Conclusions linked to evidence</text><text x="45" y="624" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Confidence, alternatives and uncertainty</text><rect x="510" y="535" width="460" height="112" rx="10" fill="#eaf0e7" stroke="#657e91" /><text x="530" y="566" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Finished intelligence</text><text x="530" y="599" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#213447" font-weight="normal">Released analysis with traceable claims</text><text x="530" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#213447" font-weight="normal">Independent quality review and human release</text><text x="25" y="690" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">The 71 signals occupy five of the seven record classes, plus XK; the last two hold none.</text><text x="25" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Changing a record’s class does not establish its truth. Mark test/replay records at creation.</text></svg>