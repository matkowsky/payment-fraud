<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780"><rect width="1000" height="780" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#45667e" /></marker></defs><text x="25" y="35" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#213447" font-weight="bold">Investigate by testing competing explanations</text><rect x="25" y="75" width="365" height="112" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="106" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Human tasking</text><text x="45" y="139" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Question to answer</text><text x="45" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Scope and authority</text><rect x="25" y="220" width="365" height="137" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="251" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Competing hypotheses</text><text x="45" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Include benign alternatives</text><text x="45" y="309" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Choose a test that separates</text><text x="45" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">explanations</text><rect x="25" y="390" width="365" height="112" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="421" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Governed query</text><text x="45" y="454" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Scoped, limited and logged</text><text x="45" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Gateway attaches coverage</text><rect x="25" y="570" width="365" height="137" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="601" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Interpretation</text><text x="45" y="634" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Scope, coverage, completeness</text><text x="45" y="659" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Revise or record inconclusive</text><text x="45" y="684" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Or mark it unassessable</text><path d="M205 187 V220" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><path d="M205 357 V390" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><path d="M390 422 H445" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><path d="M445 450 H415 V625 H390" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><path d="M25 620 H10 V276 H25" fill="none" stroke="#45667e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><rect x="445" y="225" width="530" height="237" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="465" y="256" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Interpret the test that actually ran</text><text x="465" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Complete, nonempty: matching observations in scope.</text><text x="465" y="314" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Complete, empty: tests absence only if the expected</text><text x="465" y="339" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">observable and adequate coverage are established.</text><text x="465" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Partial: no conclusion about the part not covered.</text><text x="465" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Truncated: findings may help; no population total.</text><text x="465" y="414" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Denied: a permission decision, not attack evidence.</text><text x="465" y="439" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Unavailable: the intended test did not happen.</text><rect x="445" y="570" width="530" height="112" rx="10" fill="#eaf0e7" stroke="#657e91" /><text x="465" y="601" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Draft outputs</text><text x="465" y="634" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Hunting candidates, detection candidates,</text><text x="465" y="659" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">recommendations and intelligence linked to evidence.</text><path d="M390 650 H445" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><text x="25" y="745" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#213447" font-weight="normal">Draft outputs then go to independent quality review and human release.</text></svg>