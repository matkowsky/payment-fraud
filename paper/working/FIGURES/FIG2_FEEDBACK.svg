<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="white" /><text x="25" y="35" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#213447" font-weight="bold">Decisions change what can be observed next</text><rect x="25" y="70" width="290" height="118" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="101" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Authorized decision</text><text x="45" y="134" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Allow, block, restrict, hold</text><text x="45" y="159" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Policy, version and reason</text><rect x="355" y="70" width="290" height="118" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="375" y="101" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Changed protection</text><text x="375" y="134" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Complete, delay or prevent</text><text x="375" y="159" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">New telemetry and state</text><rect x="685" y="70" width="290" height="118" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="705" y="101" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Observed reports</text><text x="705" y="134" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">Source, attribution and time</text><text x="705" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">Correctness may be unknown</text><path d="M320 125 h28 l-8 -5 m8 5 l-8 5" stroke="#36586f" fill="none" stroke-width="2" /><path d="M650 125 h28 l-8 -5 m8 5 l-8 5" stroke="#36586f" fill="none" stroke-width="2" /><rect x="25" y="225" width="296" height="155" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="256" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Delay</text><text x="45" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#213447" font-weight="normal">Reports may arrive later.</text><text x="45" y="313" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#213447" font-weight="normal">Preserve arrival and maturity;</text><text x="45" y="337" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#213447" font-weight="normal">freeze decision-time inputs.</text><rect x="341" y="225" width="326" height="155" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="361" y="256" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Unobservable outcomes</text><text x="361" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">Permanently declined:</text><text x="361" y="312" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">no chargeback on that attempt.</text><text x="361" y="335" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">Other reports may still arrive.</text><rect x="687" y="225" width="288" height="155" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="707" y="256" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">False reports</text><text x="707" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">Some reports or evidence</text><text x="707" y="312" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">can be adversarially authored.</text><text x="707" y="335" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">A report can be wrong.</text><rect x="25" y="415" width="950" height="99" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="446" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Evaluation: responsibilities 16 and 17</text><text x="45" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Define the outcome, cohort and assumptions; logs alone do not show what would have happened.</text><text x="45" y="504" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Measure user costs separately; test adaptive attacks and alternatives with the same information.</text><rect x="25" y="542" width="460" height="126" rx="10" fill="#eaf0e7" stroke="#657e91" /><text x="45" y="573" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Test provenance</text><text x="45" y="606" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Emulated/replayed/synthetic records</text><text x="45" y="631" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">stay distinguishable from production.</text><text x="45" y="656" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Authorized evaluation use is explicit.</text><rect x="510" y="542" width="465" height="126" rx="10" fill="#eaf0e7" stroke="#657e91" /><text x="530" y="573" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Correction and learning</text><text x="530" y="606" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Quality review and release (21/22).</text><text x="530" y="631" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Lessons: set apart, validate, scope,</text><text x="530" y="656" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">version, monitor and withdraw (23).</text></svg>