<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="705" viewBox="0 0 1000 705"><rect width="1000" height="705" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#45667e" /></marker></defs><text x="25" y="35" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#213447" font-weight="bold">From product records to protective decisions</text><rect x="25" y="70" width="290" height="112" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="101" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Product / security</text><text x="45" y="134" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">Products, controls and state</text><rect x="355" y="70" width="290" height="112" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="375" y="101" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#213447" font-weight="bold">Telemetry / ingestion</text><text x="375" y="134" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">Ingest; retain source and time</text><rect x="685" y="70" width="290" height="112" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="705" y="101" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Data and knowledge</text><text x="705" y="134" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Stores, entities, knowledge</text><rect x="685" y="245" width="290" height="137" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="705" y="276" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Investigation</text><text x="705" y="309" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Investigator /</text><text x="705" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">governed agent</text><text x="705" y="359" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Test, query and follow links</text><rect x="685" y="430" width="290" height="112" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="705" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Draft outputs</text><text x="705" y="494" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">Intelligence drafts, detection</text><text x="705" y="517" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#213447" font-weight="normal">candidates, recommendations</text><rect x="355" y="430" width="290" height="112" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="375" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Review / release</text><text x="375" y="494" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Independent quality (21),</text><text x="375" y="519" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">then human release (22)</text><rect x="25" y="430" width="290" height="112" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Governed decision</text><text x="45" y="494" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Human or accountable</text><text x="45" y="519" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">operational authority</text><rect x="25" y="245" width="290" height="112" rx="10" fill="#edf3f7" stroke="#657e91" /><text x="45" y="276" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#213447" font-weight="bold">Changed protection</text><text x="45" y="309" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Controls, keys and holds</text><text x="45" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">New telemetry follows</text><path d="M315 120 H355" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><path d="M645 120 H685" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><path d="M830 182 V245" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><path d="M830 382 V430" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><path d="M685 486 H645" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><path d="M355 486 H315" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><path d="M170 430 V357" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><path d="M170 245 V182" fill="none" stroke="#45667e" stroke-width="2" marker-end="url(#arrow)" /><rect x="355" y="245" width="290" height="172" rx="10" fill="#fff6e5" stroke="#657e91" /><text x="375" y="276" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="bold">Reading the records</text><text x="375" y="309" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#213447" font-weight="normal">Assessments record conclusions.</text><text x="375" y="331" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#213447" font-weight="normal">Decisions may be wrong.</text><text x="375" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#213447" font-weight="normal">The agent queries and advises;</text><text x="375" y="375" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#213447" font-weight="normal">it cannot change accounts,</text><text x="375" y="397" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#213447" font-weight="normal">payments or controls.</text><path d="M500 542 V575 H987 V124 H975" fill="none" stroke="#45667e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="25" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">Released intelligence and validated lessons become available to later investigations,</text><text x="25" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#213447" font-weight="normal">with their scope and version preserved.</text><text x="25" y="674" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#213447" font-weight="normal">Supplement S4 lists all 24 responsibilities, including inherited functions.</text></svg>