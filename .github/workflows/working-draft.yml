name: Working draft status

on:
  pull_request:
    paths:
      - 'paper/working/**'
      - '.github/workflows/working-draft.yml'
  push:
    branches: [main]
    paths:
      - 'paper/working/**'
      - '.github/workflows/working-draft.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: working-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-proposal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/test_revision_status.py
        working-directory: paper/working
      - run: python3 tools/test_iterate.py
        working-directory: paper/working
      - run: python3 CHECK_CANDIDATE.py
        working-directory: paper/working
      - run: python3 tools/revision_status.py check
        env:
          PROPOSAL_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: paper/working

  synchronize-accepted-draft:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify merge and prepare status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/revision_status.py accept
        working-directory: paper/working
      - name: Install document build tools
        if: steps.status.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern inkscape
      - name: Rebuild and check accepted documents
        if: steps.status.outputs.changed == 'true'
        working-directory: paper/working
        run: |
          python3 BUILD.py
          python3 CHECK_CANDIDATE.py
          python3 tools/test_iterate.py
          python3 tools/test_revision_status.py
          python3 tools/revision_status.py manifest
          python3 tools/revision_status.py check
      - name: Commit generated status and document updates
        if: steps.status.outputs.changed == 'true'
        run: |
          git add -- paper/working
          git diff --cached --exit-code -- paper/v1.0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize accepted working draft after merge' -m 'Automatic status, document build and manifest update. Acceptance is the separately recorded maintainer merge; this is not a publication.'
          git push origin HEAD:main
