name: Working draft status

on:
  pull_request:
    paths:
      - 'paper/working/**'
      - '.github/workflows/working-draft.yml'
  push:
    branches: [main]
    paths:
      - 'paper/working/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: working-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Contributors edit sources and data only. Generated documents, the change
  # record and the manifest are rebuilt after merge, so they are not checked here.
  check-proposal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 tools/test_revision_status.py
        working-directory: paper/working
      - run: python3 tools/test_changes_since.py
        working-directory: paper/working
      - run: python3 tools/test_iterate.py
        working-directory: paper/working
      - run: python3 tools/test_move_check.py
        working-directory: paper/working
      - run: python3 tools/test_timestamp_equality.py
        working-directory: paper/working
      - run: python3 tools/test_score_responses.py
        working-directory: paper/working
      - run: python3 CHECK_CANDIDATE.py --sources
        working-directory: paper/working
      - run: python3 tools/revision_status.py check --sources
        working-directory: paper/working
      - name: Check the journal-format copies against the source (text and numbering)
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 pandoc
          python3 tools/test_journal_build.py
          python3 JOURNAL_BUILD.py --check-only
        working-directory: paper/working

  synchronize-accepted-draft:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # a stalled package download must fail visibly, not hold the queue for hours
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # the change record traces each paragraph through the merge history
      - name: Find the merged pull request and record it
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/revision_status.py accept
        working-directory: paper/working
      - name: Install document build tools
        if: steps.status.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern inkscape
          # ACM journal template, its fonts and pdftotext, for JOURNAL_BUILD.py
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 --no-install-recommends texlive-publishers texlive-fonts-extra texlive-plain-generic fonts-linuxlibertine fonts-inconsolata poppler-utils
      - name: Rebuild both documents and the change record, then check
        if: steps.status.outputs.changed == 'true'
        working-directory: paper/working
        run: |
          python3 BUILD.py
          python3 JOURNAL_BUILD.py
          python3 tools/changes_since.py
          python3 CHECK_CANDIDATE.py
          python3 tools/test_revision_status.py
          python3 tools/test_changes_since.py
          python3 tools/test_iterate.py
          python3 tools/test_journal_build.py
          python3 tools/revision_status.py manifest
          python3 tools/revision_status.py check
      - name: Commit generated status and document updates
        if: steps.status.outputs.changed == 'true'
        run: |
          git add -- paper/working
          git diff --cached --exit-code -- paper/v1.0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize accepted working draft after merge' -m 'Automatic status, document build, change record and manifest update. Acceptance is the separately recorded maintainer merge; this is not a publication.'
          git push origin HEAD:main
